<form [formGroup]="form" (ngSubmit)="submit()">
  <app-input
    id="email"
    label="E-mail"
    type="email"
    autocomplete="email"
    formControlName="email"
    [error]="
      form.controls.email.touched && form.controls.email.hasError('required')
        ? 'E-mail é obrigatório.'
        : form.controls.email.touched && form.controls.email.hasError('email')
          ? 'Informe um e-mail válido.'
          : ''
    "
  />

  <app-input
    id="password"
    label="Senha"
    type="password"
    autocomplete="current-password"
    formControlName="password"
    [error]="
      form.controls.password.touched && form.controls.password.hasError('required')
        ? 'Senha é obrigatória.'
        : ''
    "
  />

  @if (errorMessage) {
    <p role="alert">
      {{ errorMessage }}
    </p>
  }

  <app-button type="submit" variant="primary" [disabled]="form.invalid || loading">
    @if (loading) {
      Entrando...
    } @else {
      Entrar
    }
  </app-button>
</form>
