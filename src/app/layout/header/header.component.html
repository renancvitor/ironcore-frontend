<header class="ic-header">
  <div class="ic-header__content">
    <button
      matIconButton
      type="button"
      aria-label="Abrir menu"
      matTooltip="Abrir menu"
      (click)="menuToggle.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <a matIconButton routerLink="/" aria-label="Página inicial" matTooltip="Página inicial">
      <mat-icon>home</mat-icon>
    </a>

    <a
      matIconButton
      class="ic-header__body-metrics"
      routerLink="/body-metrics"
      aria-label="Medidas corporais"
      matTooltip="Medidas corporais"
    >
      <mat-icon>accessibility_new</mat-icon>
    </a>

    <div class="ic-header__actions">
      <button
        matIconButton
        class="ic-header__theme"
        type="button"
        [attr.aria-label]="themeLabel()"
        [matTooltip]="themeLabel()"
        (click)="changeTheme()"
      >
        <mat-icon aria-hidden="true">{{ themeIcon() }}</mat-icon>
      </button>

      <button
        matIconButton
        class="ic-header__logout"
        type="button"
        aria-label="Sair da conta"
        matTooltip="Sair"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
      </button>

      <a
        matIconButton
        class="ic-header__profile"
        routerLink="/profile"
        aria-label="Meu perfil"
        matTooltip="Meu perfil"
      >
        <mat-icon>account_circle</mat-icon>
      </a>
    </div>
  </div>
</header>
