<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Aplica o tema antes do carregamento dos estilos. Mantenha a lógica alinhada com o ThemeService.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('Ironcore-theme');
        } catch {
          // Usa a preferência do sistema quando o armazenamento está indisponível.
        }
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : window.matchMedia?.('(prefers-color-scheme: dark)').matches === false
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>IroncoreFrontend</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
